
# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  say-hello:
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/executor-intro/ & https://circleci.com/docs/configuration-reference/#executor-job
    docker:
      # Specify the version you desire here
      # See: https://circleci.com/developer/images/image/cimg/base
      - image: cimg/python:3.12

    # Add steps to the job
    # See: https://circleci.com/docs/jobs-steps/#steps-overview & https://circleci.com/docs/configuration-reference/#steps
    steps:
      # Checkout the code as the first step.
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"
  build_and_test:
    docker:
      - image: cimg/python:3.12
    environment:
      PYTHONPATH: .
    steps:
      - checkout
      - run:
          name: Installing UV
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run:
          name: Create virtual environment
          command: uv venv .venv
      - run:
          name: Install dev dependencies
          command: |
            source .venv/bin/activate
            uv pip install -e .[dev]
      - run: 
          name: Check code formatting (ruff)
          command: |
            source .venv/bin/activate
            uvx ruff check .
      - run: 
          name: Run static analysis (mypy)
          command: |
            source .venv/bin/activate
            uvx mypy src/
      - run:
          name: Run unit tests with coverage
          command: |
            source .venv/bin/activate
            mkdir -p test-results
            # Use coverage directly to respect omit settings
            coverage run --source=src --rcfile=pyproject.toml -m pytest src tests
            coverage xml -o coverage.xml
            coverage report --fail-under=90
            coverage html -d coverage-html
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: coverage-html
          destination: coverage-html
      - store_artifacts:
          path: coverage.xml
          destination: coverage.xml

  test_pr_coverage_tool:
    docker:
      - image: cimg/python:3.12
    environment:
      PYTHONPATH: .
    steps:
      - checkout
      - run:
          name: Setup Git config for tests
          command: |
            git config --global user.name "CircleCI Test"
            git config --global user.email "test@circleci.com"
      - run:
          name: Installing UV
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run:
          name: Create virtual environment
          command: uv venv .venv
      - run:
          name: Install dependencies
          command: |
            source .venv/bin/activate
            uv pip install -e .[dev]
      - run:
          name: Create test repository for E2E tests
          command: |
            source .venv/bin/activate
            bash create_repo.sh
      - run:
          name: Run PR Coverage Tool tests
          command: |
            source .venv/bin/activate
            mkdir -p test-results
            coverage run --source=src --rcfile=pyproject.toml -m pytest src/pr_coverage_tool/tests tests/e2e
            coverage xml -o coverage-pr-tool.xml
            coverage html -d coverage-pr-tool
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage-pr-tool
          destination: coverage-pr-tool
      - store_artifacts:
          path: coverage-pr-tool.xml
          destination: coverage-pr-tool.xml

workflows:
  build-workflow:
    jobs:
      - build_and_test
      - test_pr_coverage_tool:
          requires:
            - build_and_test