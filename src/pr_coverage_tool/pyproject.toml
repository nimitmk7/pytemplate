[project]
name = "pr-coverage-tool"
version = "0.1.0"
description = "PR Coverage Tool component to analyze code coverage changes in pull requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coverage",
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true

[tool.ruff.lint]
ignore = ["D203", "D213", "TRY003", "EM101", "D101", "D404", "D413", "D205", "D210", "D212", "D104", "ANN101"]
select = ["D", "E", "F", "ANN", "UP", "TRY", "EM"]
exclude = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "test_*.py"]