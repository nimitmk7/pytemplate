[project]
name = "pr-coverage-tool"
version = "0.1.0"
description = "Tool for analyzing code coverage changes in pull requests"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "pytest==8.3.5",
    "coverage",
    "mypy",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.1",
    "ruff>=0.1.5",
]

[project.scripts]
pr-coverage-tool = "pr_coverage_tool.__main__:main"

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = "test_*.py"
addopts = "--cov=src --cov-config=.coveragerc --cov-report=xml --cov-report=term"
pythonpath = ["src"]
# Exclude test repositories used for E2E testing
norecursedirs = ["tests/e2e/test_repo", "tests/e2e/temp_test_repo"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
allow_untyped_decorators = true
strict = true
exclude = [
    "tests/e2e/test_repo/",
    "tests/e2e/temp_test_repo/",
]

[tool.ruff]
extend-exclude = [
    "tests/e2e/test_repo/",
    "tests/e2e/temp_test_repo/",
]

[tool.ruff.lint]
ignore = ["D203", "D213", "TRY003", "EM101", "D101", "D103", "D404", "D413", "D205", "D210", "D100", "D107", "ANN101"]
select = ["D", "E", "F", "ANN", "UP", "TRY", "EM", "W", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.coverage.run]
omit = [
    "tests/e2e/test_repo/*",
    "tests/e2e/temp_test_repo/*",
    "src/pr_coverage_tool/cli.py",
    "src/pr_coverage_tool/__main__.py",
]